<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .badge-text { font-size: 13px; font-weight: 600; fill: #000000; letter-spacing: 0.2px; }
      .brand-title { font-size: 78px; font-weight: 800; fill: #000000; letter-spacing: -2px; }
      .brand-sub { font-size: 18px; font-weight: 500; fill: #666666; letter-spacing: 1.5px; }
      .type-heading { font-size: 70px; font-weight: 800; fill: #000000; letter-spacing: -2px; }
      .type-weights { font-size: 28px; font-weight: 600; fill: #000000; letter-spacing: -0.5px; }
      .specimen-text { font-size: 20px; font-weight: 700; fill: #000000; letter-spacing: 1.2px; }
      .color-name { font-size: 17px; font-weight: 700; }
      .color-code { font-size: 11px; font-weight: 500; line-height: 1.4; }
    </style>
    <!-- Drop Shadow Filter for Cards -->
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="900" fill="#E9E3DF" />

  <!-- ============================================================ -->
  <!-- 1. LOGO SECTION                                              -->
  <!-- ============================================================ -->

  <!-- Logo Pill Badge -->
  <g transform="translate(70, 42)">
    <rect width="68" height="28" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" />
    <text x="34" y="19" text-anchor="middle" class="badge-text">Logo</text>
  </g>

  <!-- Logo Main Card (Wordmark + Icon) -->
  <g transform="translate(70, 82)" filter="url(#card-shadow)">
    <rect width="1000" height="230" rx="16" fill="#FFFFFF" />
    
    <!-- Wordmark & Emblem Lockup -->
    <g transform="translate(60, 52)">
      <!-- Wordmark -->
      <text x="0" y="85" class="brand-title">idiomar</text>
      <!-- Small Domain Tag -->
      <text x="365" y="85" font-size="28" font-weight="700" fill="#FF7A30">.ar</text>

      <!-- Logo Emblem (Scaled) -->
      <g transform="translate(480, 0) scale(1.25)">
        <g stroke-linejoin="round" stroke-linecap="round">
          <!-- Top Diamond (Flame #FF7A30) -->
          <polygon points="48.5,9 48.5,46.5 29,28.5" fill="#FF7A30" stroke="#FF7A30" stroke-width="1" transform="translate(-0.6 -0.6)" />
          <polygon points="51.5,9 71,28.5 51.5,46.5" fill="#FF7A30" stroke="#FF7A30" stroke-width="1" transform="translate(0.6 -0.6)" />

          <!-- Left Diamond (Black) -->
          <polygon points="27,30.5 46.5,48.5 9,48.5" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(-1 -0.6)" />
          <polygon points="9,51.5 46.5,51.5 27,69.5" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(-1 0.6)" />

          <!-- Right Diamond (Black) -->
          <polygon points="73,30.5 91,48.5 53.5,48.5" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(1 -0.6)" />
          <polygon points="53.5,51.5 91,51.5 73,69.5" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(1 0.6)" />

          <!-- Bottom Diamond (Black) -->
          <polygon points="29,71.5 48.5,53.5 48.5,91" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(-0.6 1)" />
          <polygon points="51.5,53.5 71,71.5 51.5,91" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(0.6 1)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Logo Secondary Card (Standalone Icon) -->
  <g transform="translate(1095, 82)" filter="url(#card-shadow)">
    <rect width="435" height="230" rx="16" fill="#FFFFFF" />
    <g transform="translate(145, 42) scale(1.45)">
      <g stroke-linejoin="round" stroke-linecap="round">
        <!-- Top Diamond (Flame #FF7A30) -->
        <polygon points="48.5,9 48.5,46.5 29,28.5" fill="#FF7A30" stroke="#FF7A30" stroke-width="1" transform="translate(-0.6 -0.6)" />
        <polygon points="51.5,9 71,28.5 51.5,46.5" fill="#FF7A30" stroke="#FF7A30" stroke-width="1" transform="translate(0.6 -0.6)" />

        <!-- Left Diamond (Black) -->
        <polygon points="27,30.5 46.5,48.5 9,48.5" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(-1 -0.6)" />
        <polygon points="9,51.5 46.5,51.5 27,69.5" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(-1 0.6)" />

        <!-- Right Diamond (Black) -->
        <polygon points="73,30.5 91,48.5 53.5,48.5" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(1 -0.6)" />
        <polygon points="53.5,51.5 91,51.5 73,69.5" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(1 0.6)" />

        <!-- Bottom Diamond (Black) -->
        <polygon points="29,71.5 48.5,53.5 48.5,91" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(-0.6 1)" />
        <polygon points="51.5,53.5 71,71.5 51.5,91" fill="#000000" stroke="#000000" stroke-width="1" transform="translate(0.6 1)" />
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 2. COLOURS SECTION                                           -->
  <!-- ============================================================ -->

  <!-- Colours Pill Badge -->
  <g transform="translate(70, 342)">
    <rect width="84" height="28" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" />
    <text x="42" y="19" text-anchor="middle" class="badge-text">Colours</text>
  </g>

  <!-- Colours Palette Card -->
  <g transform="translate(70, 382)" filter="url(#card-shadow)">
    <!-- White Card Background -->
    <rect width="690" height="460" rx="16" fill="#FFFFFF" />

    <!-- Container with rounded clip path for swatches -->
    <g transform="translate(20, 20)">
      <clipPath id="swatch-clip">
        <rect width="650" height="420" rx="12" />
      </clipPath>

      <g clip-path="url(#swatch-clip)">
        <!-- Swatch 1: Valencia Flame (#FF7A30) -->
        <g transform="translate(0, 0)">
          <rect width="235" height="420" fill="#FF7A30" />
          <text x="20" y="38" fill="#000000" class="color-name">Valencia<tspan x="20" dy="22">Flame</tspan></text>
          
          <g transform="translate(20, 325)">
            <text x="0" y="0" fill="#000000" class="color-code">
              <tspan x="0" dy="0">RGB — 255, 122, 48</tspan>
              <tspan x="0" dy="18">CMYK — 0, 52, 81, 0</tspan>
              <tspan x="0" dy="18">Pantone — 1585 C</tspan>
              <tspan x="0" dy="18">Hex — #FF7A30</tspan>
            </text>
          </g>
        </g>

        <!-- Swatch 2: Oxford Slate (#465C88) -->
        <g transform="translate(235, 0)">
          <rect width="155" height="420" fill="#465C88" />
          <text x="18" y="38" fill="#FFFFFF" class="color-name">Oxford<tspan x="18" dy="22">Slate</tspan></text>
          
          <g transform="translate(18, 325)">
            <text x="0" y="0" fill="#FFFFFF" class="color-code" fill-opacity="0.95">
              <tspan x="0" dy="0">RGB — 70, 92, 136</tspan>
              <tspan x="0" dy="18">CMYK — 49, 32, 0, 47</tspan>
              <tspan x="0" dy="18">Pantone — 534 C</tspan>
              <tspan x="0" dy="18">Hex — #465C88</tspan>
            </text>
          </g>
        </g>

        <!-- Swatch 3: Parchment Stone (#E9E3DF) -->
        <g transform="translate(390, 0)">
          <rect width="145" height="420" fill="#E9E3DF" />
          <text x="18" y="38" fill="#000000" class="color-name">Parchment<tspan x="18" dy="22">Stone</tspan></text>
          
          <g transform="translate(18, 325)">
            <text x="0" y="0" fill="#000000" class="color-code">
              <tspan x="0" dy="0">RGB — 233, 227, 223</tspan>
              <tspan x="0" dy="18">CMYK — 0, 3, 4, 9</tspan>
              <tspan x="0" dy="18">Pantone — Warm Gray 1 C</tspan>
              <tspan x="0" dy="18">Hex — #E9E3DF</tspan>
            </text>
          </g>
        </g>

        <!-- Swatch 4: Neutrals Stack (White, Slate Tint, Black) -->
        <g transform="translate(535, 0)">
          <!-- White Block -->
          <g transform="translate(0, 0)">
            <rect width="115" height="100" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
            <text x="14" y="32" fill="#000000" font-size="14" font-weight="700">White</text>
            <text x="14" y="80" fill="#888888" font-size="10" font-weight="500">#FFFFFF</text>
          </g>

          <!-- Slate Accent Block -->
          <g transform="translate(0, 100)">
            <rect width="115" height="150" fill="#677EAA" />
            <text x="14" y="32" fill="#FFFFFF" font-size="14" font-weight="700">Slate</text>
            <g transform="translate(14, 85)">
              <text x="0" y="0" fill="#FFFFFF" font-size="9.5" font-weight="500" fill-opacity="0.9">
                <tspan x="0" dy="0">RGB — 103, 126, 170</tspan>
                <tspan x="0" dy="14">CMYK — 39, 26, 0, 33</tspan>
                <tspan x="0" dy="14">Hex — #677EAA</tspan>
              </text>
            </g>
          </g>

          <!-- Black Block -->
          <g transform="translate(0, 250)">
            <rect width="115" height="170" fill="#000000" />
            <text x="14" y="32" fill="#FFFFFF" font-size="14" font-weight="700">Black</text>
            <text x="14" y="145" fill="#FFFFFF" font-size="10" font-weight="500" fill-opacity="0.8">#000000</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 3. TYPOGRAPHY SECTION                                        -->
  <!-- ============================================================ -->

  <!-- Typography Pill Badge -->
  <g transform="translate(790, 342)">
    <rect width="110" height="28" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" />
    <text x="55" y="19" text-anchor="middle" class="badge-text">Typography</text>
  </g>

  <!-- Typography Specimen Card -->
  <g transform="translate(790, 382)" filter="url(#card-shadow)">
    <rect width="740" height="460" rx="16" fill="#FFFFFF" />

    <g transform="translate(50, 48)">
      <!-- Main Font Name -->
      <text x="0" y="55" class="type-heading">Plus Jakarta</text>
      
      <!-- Weights Subheading -->
      <text x="0" y="130" class="type-weights">Regular + Medium + Bold</text>

      <!-- Specimen Grid -->
      <g transform="translate(0, 195)">
        <!-- Column 1: Uppercase -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" class="specimen-text">
            <tspan x="0" dy="0">ABCDEFGHIJ</tspan>
            <tspan x="0" dy="32">KLMNOPQR</tspan>
            <tspan x="0" dy="32">STUVWXYZ</tspan>
          </text>
        </g>

        <!-- Column 2: Lowercase -->
        <g transform="translate(230, 0)">
          <text x="0" y="0" class="specimen-text">
            <tspan x="0" dy="0">abcdefghijkl</tspan>
            <tspan x="0" dy="32">mnopqrstuv</tspan>
            <tspan x="0" dy="32">wxyz</tspan>
          </text>
        </g>

        <!-- Column 3: Numbers & Symbols -->
        <g transform="translate(450, 0)">
          <text x="0" y="0" class="specimen-text">
            <tspan x="0" dy="0">0123456789</tspan>
            <tspan x="0" dy="32">!@£$%&amp;*?,;.:</tspan>
            <tspan x="0" dy="32">#+—/(){}[]</tspan>
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
